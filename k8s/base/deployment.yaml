apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo
  labels:
    app.kubernetes.io/name: pipeline-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-demo
    spec:
      containers:
        - name: app
          image: pipeline-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
