---

- name: Provision web servers
  hosts: webservers
  become: yes
  tasks:

  - name: Install pip3
    apt:
      update_cache: yes
      name: python3-pip

  - name: Install Docker
    apt:
      name: docker.io

  - name: Enable and start Docker
    service:
      name: docker
      state: started
      enabled: yes
